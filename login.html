<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduManage Pro - Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-200 mb-3">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">EduManage Portal</h2>
      <p class="text-xs font-semibold text-slate-400 mt-1">Select your account type to login</p>
    </div>

    <!-- Role Selection Form -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Login As</label>
        <select id="user-role" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-600 outline-none bg-slate-50">
          <option value="admin">Administrator (Full Access)</option>
          <option value="teacher">Teacher (Attendance & Marks)</option>
          <option value="student">Student / Parent (Fee & Report)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Username / ID</label>
        <input type="text" id="username" required placeholder="Enter ID (e.g. admin)" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-600 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-600 outline-none">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-indigo-200 mt-2">
        Access Portal
      </button>
    </form>

    <!-- Quick Info -->
    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
      <p>Demo Login: Select role and click <strong>Access Portal</strong></p>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const role = document.getElementById('user-role').value;
      
      // Save current session role in LocalStorage
      localStorage.setItem('edumanage_user_role', role);
      
      // Redirect to main dashboard
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
